<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersecurity News Chat</title>
    <style>
        /* dark theme (DYP-60) — slate background + teal accent */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0f1115;
            color: #e6e8eb;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .chat-container::-webkit-scrollbar {
            width: 8px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: #2a2f3a;
            border-radius: 4px;
        }

        .chat-container::-webkit-scrollbar-thumb:hover {
            background: #3a4150;
        }

        .message {
            max-width: 700px;
            margin: 0 auto;
            width: 100%;
            display: flex;
        }

        .user-message {
            margin-left: auto;
            max-width: 85%;
            background: #1d2733;
            border: 1px solid #2b3a4a;
            padding: 12px 16px;
            border-radius: 14px 14px 4px 14px;
        }

        .assistant-message {
            max-width: 100%;
            padding: 14px 18px;
            line-height: 1.65;
            background: #151a21;
            border: 1px solid #232a35;
            border-left: 3px solid #2dd4a7;
            border-radius: 4px 14px 14px 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .assistant-message a {
            color: #2dd4a7;
            text-decoration: underline;
            word-break: break-all;
        }

        .assistant-message a:hover {
            color: #5ce8c2;
        }

        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 16px 18px;
            align-items: center;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2dd4a7;
            opacity: .3;
            animation: blink 1.2s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: .2s; }
        .typing-indicator span:nth-child(3) { animation-delay: .4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: .25; transform: translateY(0); }
            40% { opacity: 1; transform: translateY(-3px); }
        }

        .input-container {
            background: #12161c;
            border-top: 1px solid #232a35;
            padding: 16px 20px 20px;
        }

        .input-wrapper {
            max-width: 700px;
            margin: 0 auto;
            position: relative;
        }

        textarea {
            width: 100%;
            min-height: 60px;
            max-height: 200px;
            padding: 16px 56px 16px 16px;
            background: #1a2029;
            border: 1px solid #2b3442;
            color: #e6e8eb;
            caret-color: #2dd4a7;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            resize: none;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea::placeholder {
            color: #5b6572;
        }

        textarea:focus {
            border-color: #2dd4a7;
            box-shadow: 0 0 0 3px rgba(45, 212, 167, 0.15);
        }

        button {
            position: absolute;
            right: 12px;
            bottom: 12px;
            background: #2dd4a7;
            color: #0f1115;
            border: none;
            border-radius: 8px;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #24b890;
        }

        button:active {
            transform: scale(0.94);
        }

        button:disabled {
            background: #2a3140;
            color: #5b6572;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            color: #8b95a3;
            margin-top: 100px;
        }

        .empty-state h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #e6e8eb;
        }

        .empty-state h1::before {
            content: '● ';
            color: #2dd4a7;
        }
    </style>
</head>
<body>
    <div class="chat-container" id="chatContainer">
        <div class="empty-state">
            <h1>Cybersecurity News Chat</h1>
            <p>Ask about recent cybersecurity news, threats and vulnerabilities</p>
        </div>
    </div>

    <div class="input-container">
        <div class="input-wrapper">
            <textarea 
                id="messageInput" 
                placeholder="Type your message here..."
                rows="1"
            ></textarea>
            <button id="sendButton">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        let messages = [];

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        // Send on Enter (but allow Shift+Enter for new lines)
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendButton.addEventListener('click', sendMessage);

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // Remove empty state
            const emptyState = chatContainer.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            // Add user message
            addMessage(message, 'user');

            // Clear input
            messageInput.value = '';
            messageInput.style.height = 'auto';

            // Disable input while processing
            messageInput.disabled = true;
            sendButton.disabled = true;

            const typingEl = showTypingIndicator();

            try {
                // Call FastAPI backend
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                // never render an empty bubble — surface the problem instead (DYP-56)
                addMessage(data.response ?? 'Error: empty response from server', 'assistant');
            } catch (error) {
                addMessage('Error: Could not connect to server', 'assistant');
                console.error('Error:', error);
            } finally {
                typingEl.remove();
                // Re-enable input
                messageInput.disabled = false;
                sendButton.disabled = false;
                messageInput.focus();
            }
        }

        function showTypingIndicator() {
            const wrap = document.createElement('div');
            wrap.className = 'message';

            const dots = document.createElement('div');
            dots.className = 'typing-indicator';
            for (let i = 0; i < 3; i++) {
                dots.appendChild(document.createElement('span'));
            }

            wrap.appendChild(dots);
            chatContainer.appendChild(wrap);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return wrap;
        }

        
        function renderWithLinks(el, text) {
            const urlRe = /(https?:\/\/[^\s)]+)/g;
            let last = 0;
            let m;
            while ((m = urlRe.exec(text)) !== null) {
                el.appendChild(document.createTextNode(text.slice(last, m.index)));
                const a = document.createElement('a');
                a.href = m[0];
                a.textContent = m[0];
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                el.appendChild(a);
                last = m.index + m[0].length;
            }
            el.appendChild(document.createTextNode(text.slice(last)));
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';

            const contentDiv = document.createElement('div');
            contentDiv.className = sender === 'user' ? 'user-message' : 'assistant-message';
            if (sender === 'assistant') {
                renderWithLinks(contentDiv, text);
            } else {
                contentDiv.textContent = text;
            }

            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);

            // Scroll to bottom
            chatContainer.scrollTop = chatContainer.scrollHeight;

            messages.push({ text, sender });
        }
    </script>
</body>
</html>
